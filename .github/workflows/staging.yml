name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

# Never cancel a running deploy: an interrupted first create deletes the stack
# and leaves its retained tables behind, which blocks every retry.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run verify

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-5

      - name: Deploy
        run: npx sls deploy --stage staging
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
